# Daily pipeline, run from a PRIVATE data repository.
#
# The private repository holds the contents of data/ (the odds history,
# results, model and decision log) plus this file at
# .github/workflows/daily-pipeline.yml. Each run checks out that data and this
# public code repository, runs the pipeline, and commits the updated data back,
# so the data, the API key and the run logs never appear in the public repo.
#
# Setup: add the API key as the repository secret API_FOOTBALL_KEY. The code
# repository is assumed to be <owner>/football-corners-predictor; change
# CODE_REPOSITORY below if yours is named differently.
#
# Optional: to publish the result charts, add a fine-grained access token (Contents:
# read and write, for the code repository only) as the secret PUBLISH_TOKEN. Each
# run then replaces the charts on the `charts` branch of the code repository.
# Until that secret exists the publishing step is skipped.

name: Daily pipeline

on:
  schedule:
    # Scheduled in UTC at both candidate times; the `gate` job lets through the one
    # that falls at 8am UK time (07:05 UTC in summer, 08:05 UTC in winter). Minute 5
    # rather than 0, because runs due exactly on the hour are the ones GitHub drops
    # when it is busy.
    - cron: "5 7 * * *"
    - cron: "5 8 * * *"
  workflow_dispatch: # allows a manual run from the Actions tab

permissions:
  contents: write # to commit the updated data back to this repository

concurrency:
  group: daily-pipeline
  cancel-in-progress: false

env:
  CODE_REPOSITORY: ${{ github.repository_owner }}/football-corners-predictor

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.check.outputs.go }}
    steps:
      - id: check
        run: |
          hour=$(TZ=Europe/London date +%H)
          if [ "$GITHUB_EVENT_NAME" != "schedule" ] || [ "$hour" = "08" ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "go=false" >> "$GITHUB_OUTPUT"
            echo "It is ${hour}:xx in the UK, not 08:xx, so this scheduled run is skipped."
          fi

  run:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PUBLISH_ENABLED: ${{ secrets.PUBLISH_TOKEN != '' }}
    steps:
      - name: Check out the stored data
        uses: actions/checkout@v4
        with:
          path: data

      - name: Check out the code
        uses: actions/checkout@v4
        with:
          repository: ${{ env.CODE_REPOSITORY }}
          path: app

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/requirements.txt

      - name: Install dependencies
        run: pip install -r app/requirements.txt

      - name: Point the code at the stored data
        run: ln -s "$GITHUB_WORKSPACE/data" app/data

      - name: Run the pipeline
        working-directory: app
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: python -m corners run

      # Runs even if the pipeline failed part-way, so captured odds are never lost.
      - name: Save the updated data
        if: always()
        working-directory: data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Daily run $(date -u +%F)"
          git push

      - name: Keep the charts and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results
          path: app/results
          retention-days: 30

      # Only a fixed list of charts is published (see corners/publish.py). They show
      # markets, dates and pounds, with no fixtures, odds or provider data. Each run
      # replaces the previous charts with a single new commit on the `charts` branch,
      # so the repository doesn't accumulate a history of pictures and `main` is
      # never touched.
      - name: Publish the charts
        if: always() && env.PUBLISH_ENABLED == 'true'
        working-directory: app
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
        run: |
          python -m corners charts "$GITHUB_WORKSPACE/published"
          cd "$GITHUB_WORKSPACE/published"
          git init -q -b charts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Charts $(date -u +%F)"
          git push --force "https://x-access-token:${PUBLISH_TOKEN}@github.com/${CODE_REPOSITORY}.git" charts
