[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["corners*"]

[project]
name = "corners"
version = "2.0.0"
description = "Probabilistic forecasting of football corner counts, evaluated against market prices"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "scipy>=1.13",
    "statsmodels>=0.14",
    "matplotlib>=3.9",
    "requests>=2.32",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    # matplotlib 3.10 with NumPy 2.5: noise from the libraries, not from this project
    "ignore:The 'generic' unit for NumPy timedelta:DeprecationWarning",
]

[tool.coverage.run]
source = ["corners"]

[tool.coverage.report]
show_missing = true
fail_under = 90  # CI fails if the tests exercise less of the code than this

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # £ and similar characters are intentional

[tool.ruff.lint.isort]
known-first-party = ["corners"]
